name: Go verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Format Go source
        run: gofmt -w api/*.go
      - name: Vet
        run: go vet ./api/...
      - name: Test
        run: go test ./...
